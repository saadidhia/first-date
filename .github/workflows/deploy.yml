name: CI

on:
  push:
    branches:
      - main
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

  deploy_prod:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_BUSINESS_SERVER }}

      - name: Add server to known hosts
        run: ssh-keyscan -H 91.98.119.218 >> ~/.ssh/known_hosts

      - name: Upload source to Hetzner
        run: |
          ssh root@91.98.119.218 "mkdir -p /opt/firstdate"
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.output' --exclude '.env' \
            ./ root@91.98.119.218:/opt/firstdate/

      - name: Install, migrate, build and restart
        run: |
          ssh root@91.98.119.218 'set -e
            cd /opt/firstdate
            npm install -g pnpm@11.2.2
            pnpm install --frozen-lockfile
            set -a; . ./.env; set +a
            pnpm db:migrate
            pnpm build
            systemctl restart firstdate
            systemctl is-active firstdate'
